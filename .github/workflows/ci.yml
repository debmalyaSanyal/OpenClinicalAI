name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format and lint
        run: ruff check .
      - name: Type check
        run: mypy core apps || true
      - name: Tests
        run: pytest
      - name: Security scan
        run: bandit -r core apps -q
      - name: Docker build
        run: docker build -f docker/Dockerfile.api .
