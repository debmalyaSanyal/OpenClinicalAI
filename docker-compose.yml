services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      OPENCLINICALAI_ENVIRONMENT: development
      OPENCLINICALAI_DATABASE_URL: postgresql://openclinicalai:openclinicalai@postgres:5432/openclinicalai
      OPENCLINICALAI_NEO4J_URL: bolt://neo4j:7687
      OPENCLINICALAI_QDRANT_URL: http://qdrant:6333
      OPENCLINICALAI_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openclinicalai
      POSTGRES_PASSWORD: openclinicalai
      POSTGRES_DB: openclinicalai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/openclinicalai
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  docs:
    image: squidfunk/mkdocs-material:latest
    command: serve -a 0.0.0.0:8000
    volumes:
      - .:/docs
    ports:
      - "8001:8000"

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
