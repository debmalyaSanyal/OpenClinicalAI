models:
  - name: trocr-base-handwritten
    task: ocr
    provider: huggingface
    enabled: false
    config:
      model_id: microsoft/trocr-base-handwritten
  - name: paddleocr
    task: ocr
    provider: paddle
    enabled: false
    config: {}
  - name: llama
    task: llm
    provider: configurable
    enabled: false
    config:
      model_id: meta-llama
  - name: bge-small
    task: embedding
    provider: sentence-transformers
    enabled: false
    config:
      model_id: BAAI/bge-small-en-v1.5
